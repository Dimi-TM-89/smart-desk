# Smart Desk – Mosquitto configuration
# Installed to /etc/mosquitto/conf.d/smartdesk.conf by scripts/setup_pi.sh
#
# Mosquitto 2.x only accepts connections from the Pi itself by default.
# The Pico 2 W connects over Wi-Fi, so we listen on all interfaces.
# Anonymous access is fine on a home network for this demo; for more
# security, use a password_file instead.

listener 1883
allow_anonymous true
